name: Instagram feed checks

on:
  pull_request:
    paths:
      - 'assets/app.js'
      - 'assets/style.css'
      - 'netlify/functions/instagram-feed.mjs'
      - 'netlify/functions/instagram-avatar.mjs'
      - 'checks/instagram-function.test.mjs'
      - 'checks/instagram-avatar.test.mjs'
      - '.github/workflows/instagram-feed-checks.yml'
  push:
    branches: [main]
    paths:
      - 'assets/app.js'
      - 'assets/style.css'
      - 'netlify/functions/instagram-feed.mjs'
      - 'checks/instagram-function.test.mjs'
      - 'checks/instagram-avatar.test.mjs'
      - '.github/workflows/instagram-feed-checks.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check assets/app.js
          node --check netlify/functions/instagram-feed.mjs
          node --check netlify/functions/instagram-avatar.mjs
      - name: All project tests
        run: npm test
